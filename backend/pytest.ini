[pytest]
pythonpath = .
markers =
    live: real network / third-party API calls — skipped by default; run with `-m live`.
    destructive: rotates demo-user passwords in the shared DB; skipped by default; run with `-m destructive`.
    legacy_iteration: pre-existing iteration/phase tests with known flaky fixtures (Feb-2026 triage); skipped by default; run with `-m legacy_iteration`.
