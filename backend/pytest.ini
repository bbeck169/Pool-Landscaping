[pytest]
pythonpath = .

# Phase I1.7.e · Feb-2026 — pytest hygiene guardrail (post-Chunk 2.c).
#
# A rogue pytest process (PID 6591, ~1h20m runtime) had saturated
# MongoDB with ~800 connections in preview, tripping
# ``maxIncomingConnections`` and forcing a full backend + mongod
# restart. Prevent recurrence at two layers:
#
#   1. Per-test hard timeout (``timeout``) — any single test that
#      hangs kills its own worker thread + prints a traceback.
#      120 s is generous enough for the slowest integration test
#      (~90 s Motor batch), tight enough to fail fast on hangs.
#   2. Full-session ceiling (``session_timeout``) — the whole suite
#      cannot run longer than 20 min. Catches infinite-loop hangs,
#      leaked async tasks, and pytest-xdist orphans.
#
# Both come from ``pytest-timeout==2.4.0`` (pinned in
# ``requirements.txt``). Sibling shell watchdog:
# ``backend/scripts/cleanup_stale_pytest.sh`` (kills stale ``python
# -m pytest`` procs older than 30 min via cron).
timeout = 120
session_timeout = 1200

markers =
    live: real network / third-party API calls — skipped by default; run with `-m live`.
    destructive: rotates demo-user passwords in the shared DB; skipped by default; run with `-m destructive`.
    legacy_iteration: pre-existing iteration/phase tests with known flaky fixtures (Feb-2026 triage); skipped by default; run with `-m legacy_iteration`.
    integration: real MongoDB integration tests (e.g. `.explain()` plan verification); skipped by default; run with `-m integration`.

# Phase 41.4 · Feb-2026 — coverage gate.
#
# ``--cov`` toggles are OPT-IN via the ``ci-coverage`` marker or by
# calling ``pytest --cov=... --cov-fail-under=... backend/tests/...``
# explicitly — we do NOT enable coverage by default because the full
# backend batch has ~278 known pre-existing failures from earlier
# phases' cluster (Phase 47c/48 Stripe batch isolation + 41.1c/41.1d
# residual). Batch failures depress coverage artificially: any
# early-exit test doesn't hit its downstream setup code, so a batch
# with 278 failures looks like a coverage drop even though nothing
# actually regressed.
#
# The CI job runs coverage ONLY on the isolated-green subset:
#     pytest backend/tests/ -q -m "not live and not destructive and not legacy_iteration" \
#         --ignore-glob="backend/tests/test_stripe_phase*" \
#         --ignore-glob="backend/tests/test_phase47c_*" \
#         --ignore-glob="backend/tests/test_phase34_task_*" \
#         --ignore-glob="backend/tests/test_phase7*_rc_sms*" \
#         --cov=backend --cov-report=term-missing --cov-fail-under=<baseline-2>
#
# See ``.github/workflows/ci.yml`` for the exact invocation.
