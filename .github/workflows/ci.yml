# AquaTerra Pool & Landscaping — CI
#
# Phase 32 (Feb 2026): minimal test-gating pipeline.
# Runs backend pytest, frontend vitest, and mobile jest on every PR and
# every push to `main`. No deploy stage — that's intentional and enforced
# by `frontend/src/test/phase32-ci-config.test.jsx`.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref, but let siblings inside a single
# run report independently (see `fail-fast: false` in the matrix below).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        run: |
          pytest -c pytest.ini \
            --ignore-glob="*legacy_iteration*" \
            -m "not live and not destructive and not legacy_iteration" \
            -q

  frontend-web:
    name: frontend-web (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run vitest
        working-directory: frontend
        run: yarn vitest run --reporter=basic

  mobile:
    name: mobile (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "yarn"
          cache-dependency-path: mobile/yarn.lock

      - name: Install dependencies
        working-directory: mobile
        run: yarn install --frozen-lockfile

      - name: Run jest
        working-directory: mobile
        run: yarn test --ci --forceExit
